<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ZapLock app icon. A folder that is also a padlock, with a lightning-bolt keyhole:
       the folder stays where it is; ZapQR is the key. Brand indigo / lime. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C5CEA"/>
      <stop offset="1" stop-color="#2B37B9"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9ECFF"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F5FF"/>
      <stop offset="1" stop-color="#D9DDFB"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6FF5C"/>
      <stop offset="1" stop-color="#B6E238"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="22" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="boltshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="6" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- macOS icon tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#glow)"/>

  <!-- shackle: behind the folder, so its legs disappear into it -->
  <path d="M368 500 V336 a144 144 0 0 1 288 0 V500" fill="none" stroke="#1E2896" stroke-opacity="0.35" stroke-width="72" stroke-linecap="round" transform="translate(0 14)"/>
  <path d="M368 500 V336 a144 144 0 0 1 288 0 V500" fill="none" stroke="#FFFFFF" stroke-width="64" stroke-linecap="round"/>

  <!-- folder body = lock body -->
  <g filter="url(#shadow)">
    <rect x="216" y="414" width="250" height="110" rx="40" ry="40" fill="url(#tab)"/>
    <rect x="216" y="466" width="592" height="356" rx="52" ry="52" fill="url(#body)"/>
  </g>

  <!-- lightning-bolt keyhole -->
  <g filter="url(#boltshadow)">
    <polygon points="560,506 436,668 508,668 470,790 600,612 528,612" fill="url(#bolt)"/>
  </g>
</svg>
